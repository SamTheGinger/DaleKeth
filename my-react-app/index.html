<!doctype html> <!-- Tells the browser this is a modern (HTML5) page. -->
<html lang="en"> <!-- The whole page. lang="en" says it's in English (helps screen readers and Google). -->
  <head> <!-- Settings and information about the page; nothing here shows on screen. -->
    <meta charset="UTF-8" /> <!-- Lets symbols like ©, é and ♥ display correctly. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- The small icon on the browser tab. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Makes the page fit phone screens. -->
    <meta name="description" content="Aurora Photography: portrait and landscape photographer based in Durban, South Africa." /> <!-- The summary Google shows in search results. -->
    <title>Aurora Photography - Capturing Beauty</title> <!-- The text on the browser tab. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Starts connecting to Google Fonts early, so fonts load faster. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <!-- Same for the server that sends the font files. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" /> <!-- Loads the Inter and Playfair Display fonts. -->
  </head>
  <body>
    <div id="root"></div> <!-- An empty box. React draws the whole website inside it (see src/main.jsx). -->
    <script type="module" src="/src/main.jsx"></script> <!-- Starts the React app. -->
  </body>
</html>
